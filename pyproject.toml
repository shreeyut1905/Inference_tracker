[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inference-tracker"
version = "0.1.0"
description = "Daily tracker for useful diffusion-model optimization papers"
requires-python = ">=3.11"
dependencies = [
    "feedparser>=6.0,<7",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11,<2",
    "pytest>=8,<9",
    "pytest-httpx>=0.35,<1",
    "ruff>=0.6,<1",
]

[project.scripts]
inference-tracker = "inference_tracker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
